<style>
/* Layout: one locked painted night shot of the cliff; torn-paper subtitle at the top; small control strip. Single night world by design. */

  --paper: #efe6cf;

}

[hidden] { display: none !important; }
#c { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.tag { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 14px); left: calc(env(safe-area-inset-left, 0px) + 14px); background: var(--paper); color: var(--ink); font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .08em; padding: 6px 10px; box-shadow: 4px 4px 0 #000; transform: rotate(-1.5deg); pointer-events: none; }
.sub { position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 64px); transform: translateX(-50%) rotate(-1deg); width: max-content; max-width: min(560px, calc(100% - 32px)); box-sizing: border-box; background: var(--paper); color: var(--ink); padding: 12px 22px 14px; box-shadow: 5px 5px 0 #000; clip-path: polygon(0% 8%, 4% 0%, 12% 5%, 22% 1%, 34% 6%, 46% 0%, 58% 5%, 70% 1%, 82% 6%, 92% 1%, 100% 4%, 99% 50%, 100% 94%, 92% 100%, 80% 95%, 68% 100%, 55% 95%, 42% 100%, 30% 95%, 18% 100%, 6% 96%, 0% 100%, 1% 50%); pointer-events: none; }
.sub.off { visibility: hidden; }   /* shown solid or not at all: never a see-through strip */
.sub .who { font-family: var(--mono); font-size: 11px; font-weight: 600; letter-spacing: .12em; color: var(--red); }
.sub .line { font-size: clamp(16px, 2.4vw, 21px); font-weight: 600; line-height: 1.3; margin-top: 3px; min-height: 1.3em; }

.bar button, .bar label { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--ink); background: var(--paper); border: 0; padding: 10px 12px; min-height: 40px; box-sizing: border-box; box-shadow: 3px 3px 0 #000; cursor: pointer; }
.bar label { display: flex; align-items: center; gap: 8px; }

.bar button[aria-pressed="true"] { background: var(--amber); }

.brake { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%) rotate(-1deg); background: var(--red); color: var(--paper); font-family: var(--mono); font-size: 13px; font-weight: 600; letter-spacing: .1em; padding: 8px 14px; box-shadow: 4px 4px 0 #000; opacity: 0; transition: opacity .2s; pointer-events: none; }
.brake.on { opacity: 1; }

@media (max-width: 560px) { .hint { display: none; } }

<script type="module">
import * as THREE from 'three';
THREE.ColorManagement.enabled = false;
const hairpin = window.hairpin || { play: false, tearTo: url => { location.href = url; }, bed() {}, who: w => w, line: () => null };   // shared/hairpin.js, or bare fallbacks when opened alone

const IW = 1672, IH = 941;              // edge-lit/dark/then.jpg size in px; the whole scene lives in these units
const $ = s => document.querySelector(s);
const clamp = (x, a, b) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const damp = (k, dt) => 1 - Math.exp(-k * dt);
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };

// The cliff's side edge, traced off the painting as fractions: from the plateau's far corner down toward us, to where the rock face takes over.
const EDGE = [[.522, .432], [.5, .55], [.478, .65], [.475, .72]];
const lip = y => {   // the point on the edge at height y (a fraction of the painting), in painting px
  const i = clamp(EDGE.findIndex(([, ey]) => ey >= y), 1, EDGE.length - 1), [x0, y0] = EDGE[i - 1], [x1, y1] = EDGE[i];
  return [lerp(x0, x1, clamp((y - y0) / (y1 - y0), 0, 1)) * IW, y * IH];
};
// a seated figure's height by depth: about 50 px a metre at the taxi, more as the edge comes toward us
const figH = y => lerp(46, 70, (y / IH - EDGE[0][1]) / (EDGE[EDGE.length - 1][1] - EDGE[0][1]));

const canvas = $('#c');
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: false }); if (!renderer.capabilities.isWebGL2) throw 0; }
catch (e) { $('#msg').textContent = 'This shot needs WebGL 2.'; throw e; }
const isTouch = matchMedia('(pointer: coarse)').matches;
const DPR = Math.min(devicePixelRatio || 1, isTouch ? 1.5 : 2);
renderer.setPixelRatio(DPR);
renderer.outputColorSpace = THREE.LinearSRGBColorSpace;

/* ---------- the paintings: tonight lit and dark, the same cliff decades ago, and the cut-outs ---------- */
const mkCanvas = (w = IW, h = IH) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
// the stroke map: a high-pass of the lit painting's brightness, so bright strokes catch the light first
function strokeMap(src) {
  const a = mkCanvas(), ax = a.getContext('2d'); ax.drawImage(src, 0, 0, IW, IH);
  const m = mkCanvas(IW >> 2, IH >> 2); m.getContext('2d').drawImage(a, 0, 0, m.width, m.height);
  const s = mkCanvas(IW >> 4, IH >> 4); s.getContext('2d').drawImage(m, 0, 0, s.width, s.height);
  const b = mkCanvas(); b.getContext('2d').drawImage(s, 0, 0, IW, IH);
  const A = ax.getImageData(0, 0, IW, IH), B = b.getContext('2d').getImageData(0, 0, IW, IH).data, d = A.data;
  for (let i = 0; i < d.length; i += 4) {
    const v = clamp(128 + ((d[i] + d[i + 1] + d[i + 2]) - (B[i] + B[i + 1] + B[i + 2])), 0, 255);
    d[i] = d[i + 1] = d[i + 2] = v;
  }
  ax.putImageData(A, 0, 0); return a;
}
const loadImg = url => new Promise(res => { const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = url; });
const tex = src => { const t = new THREE.Texture(src); t.colorSpace = THREE.NoColorSpace; t.minFilter = THREE.LinearFilter; t.generateMipmaps = false; t.needsUpdate = true; return t; };
const SPRITES = ['ghost-1', 'ghost-2', 'then-car', 'then-pair', 'truck-lit', 'truck-dark'];
const [imgs, spr] = await Promise.all([Promise.all(['edge-lit.jpg', 'edge-dark.jpg', 'edge-then.jpg'].map(loadImg)), Promise.all(SPRITES.map(n => loadImg(`sprites/${n}.png`)))]);
const SPR = Object.fromEntries(SPRITES.map((n, i) => [n, spr[i]]));
let tLit, tDark, tStroke, tThen;
try { if (!imgs.every(Boolean) || !spr.every(Boolean)) throw 0; [tLit, tDark, tThen] = imgs.map(tex); tStroke = tex(strokeMap(imgs[0])); }
catch (e) { $('#msg').textContent = 'The paintings did not load. Serve this folder instead of opening the file.'; throw e; }
$('#msg').hidden = true;

/* ---------- shared light model, in painting pixels ---------- */
const NOISE = /* glsl */`
float h12(vec2 p){ vec3 p3 = fract(vec3(p.xyx) * .1031); p3 += dot(p3, p3.yzx + 33.33); return fract((p3.x + p3.y) * p3.z); }
float vn2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f); return mix(mix(h12(i), h12(i+vec2(1,0)), f.x), mix(h12(i+vec2(0,1)), h12(i+vec2(1,1)), f.x), f.y); }`;
const U = {
  tLit: { value: tLit }, tDark: { value: tDark }, tStroke: { value: tStroke }, tThen: { value: tThen }, uThen: { value: 0 },
  uImg: { value: new THREE.Vector2(IW, IH) },
  uHead: { value: new THREE.Vector2(-999, -999) }, uDir: { value: new THREE.Vector2(1, 0) }, uScale: { value: 1.1 },
  uMode: { value: 0 }, uTime: { value: 0 },
  uEdge: { value: new THREE.Vector4(...lip(EDGE[0][1]), ...lip(.72)) }, uEmb: { value: new THREE.Vector3(-999, -999, 0) }, uFog: { value: 0 }, uSpill: { value: 1 },
};
const LIGHT = NOISE + /* glsl */`
uniform vec2 uImg, uHead, uDir; uniform float uScale, uMode, uTime, uSpill;
uniform sampler2D tLit, tDark, tStroke;
float lightAt(vec2 p){
  vec2 v = p - uHead; float along = dot(v, uDir); float perp = length(v - uDir * along);
  float range = 560. * uScale;
  float cone = step(0., along) * (1. - smoothstep(along * .30, along * .42 + 6., perp)) * (1. - smoothstep(range * .45, range, along));
  float spill = 1. - smoothstep(26. * uScale, 120. * uScale, length(v * vec2(1., 2.2)));
  return cone * 1.5 + spill * 1.1 * uSpill;
}
vec2 uvOf(vec2 p){ return vec2(p.x / uImg.x, 1. - p.y / uImg.y); }
float reveal(vec2 p, float L){
  float s = texture2D(tStroke, uvOf(p)).r;
  float t = .22 + .6 * (1. - s);          // bright strokes catch the light first
  float on = smoothstep(t - .05, t + .05, L);
  return uMode > 1.5 ? 1. : (uMode > .5 ? 0. : on);
}`;

/* ---------- the painting, the cloud, the smoke ---------- */
const scene = new THREE.Scene();
const camera = new THREE.OrthographicCamera(0, IW, 0, -IH, -1000, 1000);
camera.position.z = 500;
const bgMat = new THREE.ShaderMaterial({
  uniforms: U,
  vertexShader: 'varying vec2 vPx; void main(){ vec4 w = modelMatrix * vec4(position, 1.); vPx = vec2(w.x, -w.y); gl_Position = projectionMatrix * viewMatrix * w; }',
  fragmentShader: LIGHT + /* glsl */`
    uniform vec4 uEdge; uniform vec3 uEmb; uniform float uFog; uniform sampler2D tThen; uniform float uThen;
    varying vec2 vPx;
    void main(){
      vec2 p = vPx, uv = uvOf(p);
      vec3 lit = texture2D(tLit, uv).rgb, dark = texture2D(tDark, uv).rgb;
      float L = lightAt(p);
      vec3 col = mix(dark, lit * vec3(1.05, .97, .86), reveal(p, L));
      // the cloud sea past the edge drifts, and the beams light it from inside
      float lx = mix(uEdge.x, uEdge.z, (p.y - uEdge.y) / (uEdge.w - uEdge.y));
      float cloudy = smoothstep(lx + 10., lx + 90., p.x) * smoothstep(.28 * uImg.y, .36 * uImg.y, p.y);
      float m = smoothstep(.35, .85, vn2(vec2(p.x * .004 + uTime * .02, p.y * .009)) * .7 + vn2(vec2(p.x * .012 - uTime * .035, p.y * .025)) * .3);
      vec3 mist = mix(vec3(.24, .28, .40), vec3(1., .93, .76), clamp(L * .6, 0., 1.));
      float live = step(uMode, .5);
      col = mix(col, mist, m * cloudy * (.25 + .3 * clamp(L, 0., 1.)) * live);
      // the cloud line: on the drive in, the cloud swallows everything and the beams hit a wall of white
      col = mix(col, mix(vec3(.3, .34, .45), vec3(1., .95, .82), clamp(L * .7, 0., 1.)), uFog * (.55 + .45 * m));
      col += vec3(.9, .8, .55) * clamp(L - .2, 0., 1.) * cloudy * .12 * live;
      // smoke off the ember: a thin curl that widens as it rises and goes back into the mist
      vec2 q = p - uEmb.xy; float h = -q.y;
      float cx = sin(h * .06 - uTime * 1.1) * h * .08 + h * .35;   // curls, and the wind takes it out over the drop
      float wid = max(2.5 + h * .07, .5), dx = (q.x - cx) / wid;
      float sm = exp(-dx * dx) * smoothstep(0., 8., h) * (1. - smoothstep(30., 110., h)) * (.6 + .4 * vn2(vec2(q.x * .05, h * .04 - uTime * .8)));
      col = mix(col, vec3(.62, .64, .72), clamp(sm * uEmb.z * .45, 0., 1.) * live);
      // now -> then: the story wipes the old cliff in, left to right, bright strokes first
      float fld = p.x / uImg.x * .75 + (1. - texture2D(tStroke, uv).r) * .25;
      float th = smoothstep(fld - .04, fld + .04, uThen * 1.1 - .05);
      vec3 thenC = mix(texture2D(tThen, uv).rgb, vec3(.86, .74, .58), m * cloudy * .4);
      col = mix(col, thenC, th);
      gl_FragColor = vec4(col, 1.);
    }`,
});
const bg = new THREE.Mesh(new THREE.PlaneGeometry(IW, IH), bgMat);
bg.position.set(IW / 2, -IH / 2, -400);
scene.add(bg);

/* ---------- the taxi: a modified 80s hatchback, painted two-tone, inked ---------- */
// Livery is a guess: black body, yellow roof. Swap these two if Shillong's run the other way.
const LIVERY = { body: '#1c1e23', roof: '#f2c230' };
const jeepMat = new THREE.ShaderMaterial({
  uniforms: { uL: { value: .3 }, uMode: U.uMode },
  vertexShader: /* glsl */`
    attribute vec3 color; attribute float emit; varying vec3 vC; varying vec3 vN; varying float vE; varying vec3 vP;
    void main(){ vC = color; vE = emit; vP = position; vN = normalize(mat3(modelViewMatrix) * normal); gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.); }`,
  fragmentShader: /* glsl */`
    uniform float uL, uMode; varying vec3 vC; varying vec3 vN; varying float vE; varying vec3 vP;
    void main(){
      vec3 n = normalize(vN);
      if (vE > .5 && vE < 1.5) { gl_FragColor = vec4(vC * 1.08, 1.); return; }
      float k = dot(n, normalize(vec3(-.4, .7, .6)));
      float lit = step(.15, k * (.45 + uL)) * clamp(uL, .25, 1.);
      if (uMode > 1.5) lit = step(-.25, k);       // lit painting: the car in full daylight colour
      else if (uMode > .5) lit = 0.;             // dark painting: the car fully in night tones
      vec3 col = mix(vC * vec3(.30, .34, .52), vC * vec3(1.03, .96, .86), lit);
      col += vec3(.05, .06, .1) * step(.72, n.y);
      col += vec3(.035, .04, .06) + vec3(.09, .11, .18) * smoothstep(.45, .8, 1. - abs(n.z));
      if (vE > 1.5) {
        float streak = step(.8, fract((vP.x * 1.3 + vP.y * 2.4) * 1.2));
        col = mix(vec3(.07, .09, .15), vec3(.36, .43, .56), streak * .55 + step(.55, n.y) * .18 + lit * .12);
      }
      gl_FragColor = vec4(col, 1.);
    }`,
});
function colorize(g, hex, emit = 0) {
  const c = new THREE.Color(hex), n = g.attributes.position.count, a = new Float32Array(n * 3), e = new Float32Array(n).fill(emit);
  for (let i = 0; i < n; i++) a.set([c.r, c.g, c.b], i * 3);
  g.setAttribute('color', new THREE.BufferAttribute(a, 3)); g.setAttribute('emit', new THREE.BufferAttribute(e, 1)); return g;
}
// jeep -> hang (the seesaw pivot, on the lip just behind the front axle) -> body
const PIVOT = new THREE.Vector3(.55, .2, 0);
const jeep = new THREE.Group(), hang = new THREE.Group(), body = new THREE.Group();
jeep.add(hang); hang.add(body); hang.position.copy(PIVOT); body.position.copy(PIVOT).negate();
const parts = [];
const put = (geo, hex, { x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0, emit = 0 } = {}, parent = body) => {
  geo.rotateX(rx); geo.rotateY(ry); geo.rotateZ(rz); geo.translate(x, y, z);
  const m = new THREE.Mesh(colorize(geo, hex, emit), jeepMat); parent.add(m); parts.push(m); return m;
};
const extrude = (pts, depth, bevel) => {
  const sh = new THREE.Shape(); sh.moveTo(...pts[0]); for (const p of pts.slice(1)) sh.lineTo(...p); sh.closePath();
  const g = new THREE.ExtrudeGeometry(sh, { depth, bevelEnabled: true, bevelThickness: bevel, bevelSize: bevel, bevelSegments: 3, curveSegments: 6 });
  g.translate(0, 0, -depth / 2); return g;
};
// lower body: short sloping bonnet, flat sides, near-vertical hatch
put(extrude([[-1.62, .24], [-1.66, .52], [-1.62, .84], [.95, .88], [1.56, .74], [1.64, .66], [1.64, .3], [1.58, .24]], 1.36, .06), LIVERY.body);
// cabin: tall glasshouse, slight tumblehome
put(extrude([[-1.55, .84], [-1.46, 1.34], [-1.38, 1.39], [.4, 1.39], [.5, 1.33], [.96, .88]], 1.18, .045), LIVERY.body);
put(new THREE.BoxGeometry(1.66, .03, 1.1), LIVERY.roof, { x: -.49, y: 1.445 });
// glass
for (const sgn of [-1, 1]) {
  put(extrude([[-1.38, .93], [-1.32, 1.3], [.37, 1.31], [.84, .93]], .01, .004), '#000000', { z: sgn * .64, emit: 2 });
  put(new THREE.BoxGeometry(.07, .42, .025), LIVERY.body, { x: -.36, y: 1.12, z: sgn * .65 });
  put(new THREE.BoxGeometry(.06, .4, .025), LIVERY.body, { x: -1.0, y: 1.12, z: sgn * .65 });
}
put(new THREE.BoxGeometry(.02, .6, 1.08), '#000000', { x: .73, y: 1.12, rz: .82, emit: 2 });
put(new THREE.BoxGeometry(.02, .41, 1.08), '#000000', { x: -1.53, y: 1.12, rz: -.22, emit: 2 });
// the sound system, visible through the hatch glass
for (const zz of [-.3, .3]) {
  put(new THREE.CylinderGeometry(.11, .11, .02, 18), '#2a2b30', { x: -1.56, y: 1.0, z: zz, rz: Math.PI / 2 });
  put(new THREE.CylinderGeometry(.045, .045, .025, 12), '#6a6d75', { x: -1.565, y: 1.0, z: zz, rz: Math.PI / 2 });
}
// lamps, grille, bumpers, yellow commercial plates
for (const sgn of [-1, 1]) {
  put(new THREE.BoxGeometry(.03, .14, .3), '#fff6d6', { x: 1.69, y: .62, z: sgn * .46, emit: 1 });
  put(new THREE.BoxGeometry(.03, .07, .1), '#ffb347', { x: 1.68, y: .49, z: sgn * .6 });
  put(new THREE.BoxGeometry(.03, .26, .15), '#c8352a', { x: -1.69, y: .66, z: sgn * .58, emit: 1 });
  put(new THREE.BoxGeometry(.06, .08, .13), LIVERY.body, { x: .86, y: .98, z: sgn * .76 });
  put(new THREE.BoxGeometry(.014, .48, .014), '#5a5e68', { x: -.36, y: .6, z: sgn * .755 });
  put(new THREE.BoxGeometry(.014, .48, .014), '#5a5e68', { x: .9, y: .6, z: sgn * .755 });
  put(new THREE.BoxGeometry(.1, .025, .02), '#8b8f96', { x: -.46, y: .78, z: sgn * .76 });
}
put(new THREE.BoxGeometry(.02, .08, .6), '#0d0e10', { x: 1.7, y: .6 });
put(new THREE.BoxGeometry(.12, .14, 1.46), '#141518', { x: 1.69, y: .32 });
put(new THREE.BoxGeometry(.12, .14, 1.46), '#141518', { x: -1.69, y: .32 });
put(new THREE.BoxGeometry(.02, .12, .42), '#f4cf3a', { x: 1.76, y: .42 });
put(new THREE.BoxGeometry(.02, .12, .42), '#f4cf3a', { x: -1.76, y: .5 });
put(new THREE.CylinderGeometry(.006, .006, .75, 4), '#111215', { x: .7, y: 1.25, z: .66, rz: .35 });
// wider aftermarket tyres sticking out of the arches, dark alloys with a chrome lip
for (const [x, sgn] of [[1.07, 1], [1.07, -1], [-1.07, 1], [-1.07, -1]]) {
  put(new THREE.CylinderGeometry(.33, .33, .02, 20), '#0b0c0e', { x, y: .3, z: sgn * .752, rx: Math.PI / 2 });
  put(new THREE.TorusGeometry(.34, .04, 6, 18, Math.PI), '#0d0e10', { x, y: .3, z: sgn * .76 });
  put(new THREE.CylinderGeometry(.29, .29, .28, 20), '#121316', { x, y: .29, z: sgn * .72, rx: Math.PI / 2 });
  put(new THREE.CylinderGeometry(.18, .18, .29, 16), '#4d5158', { x, y: .29, z: sgn * .72, rx: Math.PI / 2 });
  put(new THREE.TorusGeometry(.18, .016, 6, 20), '#c9ccd1', { x, y: .29, z: sgn * .867 });
  put(new THREE.CylinderGeometry(.05, .05, .3, 8), '#24262a', { x, y: .29, z: sgn * .72, rx: Math.PI / 2 });
}
// front doors, hinged at the A-pillar. Right-hand drive: the passenger's is the far side (-z), yours faces the camera (+z).

      if (!QS.has('hang')) hangIn.value = clamp(1 - drv.heldWin / Math.max(drv.inWin, .01) * 1.1, .05, 1).toFixed(2);
      body.position.y = -PIVOT.y; $('#brake').classList.remove('on');
      go('car');
    }
  } else U.uFog.value = phase === 'car' ? .85 * (1 - sstep(.5, 4, since)) : 0;
  if (phase === 'flick' && since > 3.5 && fallT < 0) { fallT = 0; creak(1.4); }
  if (phase === 'flick' && since > 8) go('truck');
  if (fallT >= 0) {
    // past the balance point: the nose goes, then the whole car slides off the lip into the cloud
    fallT += dt; angV += (2 + Math.sin(ang) * 6) * dt; ang = Math.min(ang + angV * dt, 1.45);
    const f = Math.max(0, fallT - .8);
    jeep.position.set(CAR[0] + 260 * f, -CAR[1] - 450 * f * f, 150);   // out, clear of the lip, and down
  } else if (phase !== 'drive') {
    const target = reset() + tips * lerp(.04, .1, H) + Math.sin(t * .8) * .012 + Math.sin(t * 1.9 + 1) * .005;
    angV += ((target - ang) * 26 - angV * 2.2) * dt; ang += angV * dt;
  }
  hang.rotation.z = -ang;
  for (const d of doors) d.rotation.y = lerp(d.rotation.y, d.userData.side * 1.1 * d.userData.open, damp(4, dt));
  if (ac && t > nextCreak) { creak(.35 + Math.random() * .35); nextCreak = t + 6 + Math.random() * 6; }
  jeep.updateMatrixWorld(true);
  // headlights: from the nose, wherever the nose now points
  const a = body.localToWorld(v1.set(1.72, .62, 0)), b = body.localToWorld(v2.set(2.72, .62, 0));
  U.uHead.value.set(a.x, -a.y); U.uDir.value.set(b.x - a.x, a.y - b.y).normalize();
  if (truck.visible) {   // the truck rolls in round the bend and stops; now its headlights are the light
    const k = phase === 'truck' ? 1 - Math.pow(1 - clamp(since / 5, 0, 1), 2.2) : 1, x = lerp(TRUCK.from, TRUCK.to, k);
    truck.position.set(x, -TRUCK.y + (k < 1 ? Math.sin(t * 9) * .8 : 0), 140);
    U.uHead.value.set(x + truckW * .48, TRUCK.y - TRUCK.h * .2); U.uDir.value.set(1, .04).normalize();
  }
  // then: the old car and the two of them, only while the story's in the old painting
  thenCar.material.opacity = thenPair.material.opacity = sstep(.55, .95, U.uThen.value);
  const now = 1 - sstep(.05, .35, U.uThen.value);   // the present steps out of the way of the story
  jeep.visible = now > .5;
  for (const w of walkers) w.m.material.opacity = now;
  U.uSpill.value = phase === 'drive' || truck.visible ? 1 : 0;
  // getting out and sitting down
  for (const w of walkers) {
    if (!w.m.visible) continue;
    w.k = clamp((t - w.t0) / 2.4, 0, 1);
    const e = w.k * w.k * (3 - 2 * w.k), x = lerp(w.from[0], w.to[0], e), y = lerp(w.from[1], w.to[1], e), h = figH(y);
    w.m.position.set(x, -y + Math.abs(Math.sin(w.k * Math.PI * 5)) * 4 * (1 - w.k), 200 + y * .1);
    w.m.scale.set(h * 200 / 240, h, 1);
  }
  if (phase === 'car' && since > 2.2 && !hangSaid) { hangSaid = true; const l = hairpin.line('hang'); if (l) say(l.who, l.text, 3.4, l.expr); }
  if (phase === 'yout' && walkers[1].k >= 1) go('seated');
  if (phase === 'seated' && lineI < SCRIPT.length && since > SCRIPT[lineI][0]) { const [, who, text] = SCRIPT[lineI++]; say(who, text, 4); }
  U.uThen.value = phase === 'seated' ? sstep(...T.thenIn, since) * (1 - sstep(...T.thenOut, since)) : 0;
  // him and the ember
  const seated = phase === 'seated', flick = phase === 'flick';
  const appear = seated ? sstep(...T.ghost, since) : flick ? 1 - sstep(0, 1.5, since) : 0;
  const near = ptr ? sstep(gh * .5, gh * 2.2, Math.hypot(ptr[0] - GX, ptr[1] - (G[1] - gh * .5))) : 1;
  ghostMat.uniforms.uOp.value = appear * near;
  let glow = 0;
  if (seated) {
    const k = (Math.max(0, since - T.ember) / 7) % 1, drag = k < .12 ? sstep(0, .12, k) : Math.exp(-(k - .12) * 9);
    const f = since > T.ghost[0] && k < .3 ? 1 : 0;   // the drag: cigarette at his lips
    ghostMat.uniforms.tG.value = GHOST[f].tex; emb.pos.set(...tipAt(f));
    glow = sstep(T.ember, T.ember + 1, since) * (.45 + .75 * drag + Math.sin(t * 23) * .05);
  } else if (flick) {
    emb.vel.y += 38 * dt; emb.vel.x *= 1 - .4 * dt; emb.pos.addScaledVector(emb.vel, dt);   // falls slowly into the cloud
    glow = (1 - sstep(0, 5, since)) * (.8 + .2 * Math.sin(t * 30));
  }
  ember.visible = glow > 0;
  emberMat.uniforms.uI.value = glow;
  ember.position.set(emb.pos.x, -emb.pos.y, 300);
  U.uEmb.value.set(emb.pos.x, emb.pos.y, (seated ? sstep(T.ember, T.ember + 2, since) : 0) + (flick ? 1 - sstep(0, 2, since) : 0));
  // subtitle types itself on
  if (full) {
    if (typed < full.length) { typed = Math.min(full.length, typed + dt * 30); $('#line').textContent = full.slice(0, Math.max(0, Math.floor(typed))); }
    if (t > lineEnd) { $('#sub').classList.add('off'); full = ''; }
  }
  const lab = LABEL[phase], dis = !ready();
  if (bNext.textContent !== lab) bNext.textContent = lab;
  if (bNext.disabled !== dis) bNext.disabled = dis;
  // render: info (taxi mask + normals), colour, then ink and paper rim
  for (const m of parts) m.material = infoJeep;
  const hidden = [];
  scene.traverse(o => { if (o.isMesh && !parts.includes(o) && o.visible) { o.visible = false; hidden.push(o); } });
  renderer.setRenderTarget(rtInfo); renderer.setClearColor(0x8080ff, 0); renderer.clear(); renderer.render(scene, camera);
  for (const o of hidden) o.visible = true;
  for (const m of parts) m.material = jeepMat;
  renderer.setRenderTarget(rtColor); renderer.setClearColor(0x10142a, 1); renderer.clear(); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  window.hairpin?.ready();   // first frame drawn: the paper can lift
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
