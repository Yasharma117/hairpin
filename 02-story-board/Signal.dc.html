<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signal style frame</title>

<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&amp;family=IBM+Plex+Mono:wght@400;600&amp;display=swap">
<style>
body{margin:0}
a{color:#ff4a3d}a:hover{color:#ff7a70}
</style>

<div style="width: 960px; height: 600px; position: relative; overflow: hidden; background: #07080d; color: #ece8dc; font-family: 'IBM Plex Mono', monospace">
<svg width="960" height="600" viewBox="0 0 960 600" style="position: absolute; inset: 0; display: block" aria-hidden="true">
<defs>
<filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="22" /></filter>
<filter id="chalk" x="-2%" y="-2%" width="104%" height="104%"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="1" seed="5" /><feDisplacementMap in="SourceGraphic" scale="2.2" /></filter>
<mask id="voice" maskUnits="userSpaceOnUse" x="0" y="0" width="960" height="600">
<rect x="0" y="0" width="960" height="600" fill="#000" />
<g filter="url(#soft)">
<circle cx="256" cy="500" r="120" fill="#fff" />
<circle cx="256" cy="500" r="230" fill="none" stroke="#fff" stroke-width="54" />
<circle cx="256" cy="500" r="360" fill="none" stroke="#fff" stroke-opacity="0.65" stroke-width="44" />
<circle cx="256" cy="500" r="500" fill="none" stroke="#fff" stroke-opacity="0.35" stroke-width="34" />
</g>
</mask>
</defs>

<g mask="url(#voice)" filter="url(#chalk)" fill="none" stroke="#ece8dc" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">

<path d="M120 588 C 300 562 690 548 735 472 C 760 427 420 442 395 382 C 375 332 610 337 600 287 C 592 247 540 217 520 174" stroke="#07080d" stroke-width="21" />
<path d="M120 588 C 300 562 690 548 735 472 C 760 427 420 442 395 382 C 375 332 610 337 600 287 C 592 247 540 217 520 174" stroke-dasharray="8 12" stroke-opacity="0.8" />
<path d="M330 452 L330 420 L352 404 L374 420 L374 452 Z" /><path d="M326 422 L352 400 L378 422" /><rect x="344" y="432" width="10" height="20" />
<path d="M470 430 L470 404 L488 392 L506 404 L506 430 Z" /><path d="M466 406 L488 388 L510 406" />

</g>

<g fill="none" stroke="#ff4a3d">
<circle cx="256" cy="500" r="230" stroke-width="1.2" stroke-opacity="0.85" />
<circle cx="256" cy="500" r="360" stroke-width="1.1" stroke-opacity="0.55" />
<circle cx="256" cy="500" r="500" stroke-width="1" stroke-opacity="0.3" />
</g>
<circle cx="268" cy="494" r="5" fill="#ff4a3d" />

<line x1="40" y1="566" x2="920" y2="566" stroke="#ece8dc" stroke-opacity="0.18" />
<path d="{{wave}}" fill="none" stroke="#ff4a3d" stroke-width="1.4" />
<line x1="430" y1="540" x2="430" y2="592" stroke="#ece8dc" stroke-width="1.2" />
<circle cx="430" cy="566" r="4" fill="#ece8dc" />
</svg>

<div style="position: absolute; left: 28px; top: 26px; display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; letter-spacing: 0.1em">
<span style="width: 9px; height: 9px; border-radius: 50%; background: #ff4a3d; display: inline-block"></span>
<span>BEND 02 / BYRNIHAT</span>
<span style="color: #8d8a83; font-weight: 400">VOICE 01 · KONG DARI</span>
</div>

<div style="position: absolute; left: 50%; top: 92px; transform: translateX(-50%); width: 760px; text-align: center; font-family: 'DotGothic16', 'IBM Plex Mono', monospace; font-size: 26px; line-height: 1.45; letter-spacing: 0.04em">HE SAID HE'D WRITE FROM DELHI.<br><span style="color: #8d8a83">I WAITED AT THIS BEND FOR A WHOLE YEAR.</span></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":960,"height":600}}'>
class Component extends DCLogic {
renderVals() {
const pts = [];
for (let i = 0; i <= 220; i++) {
const x = 40 + i * 4;
const env = Math.max(0, Math.sin(i * 0.045) * 0.8 + Math.sin(i * 0.013 + 1.2) * 0.5);
const y = 566 + Math.sin(i * 1.9) * Math.sin(i * 0.37 + 0.6) * 22 * env;
pts.push((i ? 'L' : 'M') + x.toFixed(1) + ' ' + y.toFixed(1));
}
return { wave: pts.join(' ') };
}
}
</script>
</body>
</html>
